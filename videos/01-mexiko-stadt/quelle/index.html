</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,CY=860;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=i=>WORDS[i][1];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const win=(t,a,b,f=.3)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(a,b,x){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],x))).join(',')})`}

// ---------- geography ----------
const LAKES1519={
 texcoco:[[-99.17,19.40],[-99.19,19.43],[-99.18,19.47],[-99.15,19.49],[-99.12,19.50],[-99.08,19.55],[-99.05,19.61],[-99.00,19.62],[-98.95,19.57],[-98.90,19.52],[-98.92,19.46],[-98.96,19.41],[-99.00,19.37],[-99.05,19.35],[-99.10,19.36],[-99.13,19.365],[-99.16,19.38]],
 xochimilco:[[-99.15,19.33],[-99.13,19.37],[-99.10,19.34],[-99.05,19.32],[-99.02,19.28],[-99.06,19.26],[-99.12,19.26],[-99.16,19.28],[-99.17,19.31]],
 chalco:[[-99.03,19.30],[-98.97,19.30],[-98.90,19.28],[-98.88,19.24],[-98.93,19.22],[-99.00,19.23],[-99.04,19.26]],
 xaltocan:[[-99.10,19.66],[-99.03,19.64],[-98.97,19.68],[-98.99,19.74],[-99.05,19.76],[-99.10,19.73]],
 zumpango:[[-99.15,19.77],[-99.09,19.76],[-99.07,19.80],[-99.10,19.83],[-99.15,19.82]]
};
const REMNANT=[-98.985,19.475];
const ISLAND=[-99.133,19.437];
const CITY=[[-99.29,19.31],[-99.25,19.20],[-99.15,19.17],[-99.05,19.21],[-98.95,19.26],[-98.91,19.35],[-98.96,19.42],[-98.94,19.50],[-98.99,19.58],[-99.05,19.69],[-99.12,19.67],[-99.19,19.61],[-99.25,19.53],[-99.29,19.43]];
const MOUNTAINS=[[-98.622,19.023,1.5],[-98.642,19.178,1.35],[-99.26,19.21,0.9],[-99.34,19.31,0.8],[-99.36,19.43,0.75],[-99.32,19.56,0.7],[-98.72,19.36,0.9],[-98.74,19.50,0.85],[-98.80,19.66,0.7],[-99.22,19.78,0.6],[-98.88,19.82,0.6],[-99.45,19.15,0.8],[-98.95,19.05,0.7]];
const VERACRUZ=[-96.13,19.19];

function cr(pts,n=10){ // closed catmull-rom
 const out=[],L=pts.length;
 for(let i=0;i<L;i++){const p0=pts[(i-1+L)%L],p1=pts[i],p2=pts[(i+1)%L],p3=pts[(i+2)%L];
  for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
   out.push([0,1].map(j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}
 return out}
const centroid=p=>[p.reduce((a,b)=>a+b[0],0)/p.length,p.reduce((a,b)=>a+b[1],0)/p.length];
const SM={};for(const k in LAKES1519)SM[k]=cr(LAKES1519[k]);
const CITYS=cr(CITY);

// ---------- camera ----------
const CAM=[
 [0,-93,23,78],[0.25,-93,23,78],[2.3,-99.03,19.45,0.95],[7.3,-99.06,19.43,0.8],[9.3,-99.06,19.43,0.75],
 [10.6,-99.05,19.47,0.9],[16.1,-99.06,19.46,0.82],[18.4,-99.125,19.435,0.30],[22.8,-99.13,19.435,0.24],
 [25.0,-99.10,19.43,0.42],[31.3,-99.09,19.44,0.46],[33.4,-97.6,19.5,7.5],[35.2,-97.7,19.5,7.0],[36.9,-99.05,19.46,0.9],
 [45.8,-99.04,19.49,0.98],[47.5,-99.09,19.44,0.9],[52,-99.09,19.44,0.82],[71.8,-99.08,19.44,0.78],[80,-99.08,19.44,1.5]];
function cam(t){
 let i=0;while(i<CAM.length-2&&t>CAM[i+1][0])i++;
 const a=CAM[i],b=CAM[i+1],x=ease(seg(t,a[0],b[0]));
 return [lerp(a[1],b[1],x),lerp(a[2],b[2],x),Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),x))]}

// ---------- textures ----------
const paper=document.createElement('canvas');paper.width=W;paper.height=H;
(function(){const p=paper.getContext('2d');p.fillStyle='#fff';p.fillRect(0,0,W,H);
 let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<260;i++){const x=r()*W,y=r()*H,rad=40+r()*220;const g=p.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(120,90,40,${0.05+r()*0.08})`);g.addColorStop(1,'rgba(120,90,40,0)');p.fillStyle=g;p.fillRect(x-rad,y-rad,rad*2,rad*2)}
 const id=p.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*26;d[i]+=n;d[i+1]+=n;d[i+2]+=n}p.putImageData(id,0,0)})();

// ---------- helpers ----------
function text(str,x,y,{font='800 64px Inter',fill='#fff',stroke=null,lw=10,align='center',alpha=1,shadow=true,scale=1}={}){
 if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.scale(scale,scale);ctx.font=font;ctx.textAlign=align;ctx.textBaseline='middle';
 if(shadow){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.shadowOffsetY=4}
 if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeText(str,0,0);ctx.shadowColor='transparent'}
 ctx.fillStyle=fill;ctx.fillText(str,0,0);ctx.restore()}
function ringPath(P,proj){ctx.beginPath();P.forEach((p,i)=>{const q=proj(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath()}
function emoji(e,x,y,size,alpha=1,rot=0){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px "Noto Color Emoji"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore()}
function drop(x,y,s,level,alpha){ // water drop with fill level
 if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);
 const path=()=>{ctx.beginPath();ctx.moveTo(0,-100);ctx.bezierCurveTo(30,-50,70,-10,70,30);ctx.arc(0,30,70,0,Math.PI);ctx.bezierCurveTo(-70,-10,-30,-50,0,-100);ctx.closePath()};
 path();ctx.fillStyle='rgba(10,30,50,.55)';ctx.fill();ctx.save();path();ctx.clip();
 const top=100-level*200;ctx.fillStyle=level<.3?'#e0503c':'#3aa0e8';ctx.fillRect(-80,top,160,220);ctx.restore();
 path();ctx.lineWidth=9;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore()}
function chevrons(x,y,t,alpha){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#ff4d3d';ctx.lineWidth=16;ctx.lineCap='round';ctx.lineJoin='round';
 for(let i=0;i<3;i++){const ph=((t*1.6+i/3)%1);ctx.globalAlpha=alpha*Math.sin(ph*Math.PI);const yy=y+ph*120;ctx.beginPath();ctx.moveTo(x-60,yy);ctx.lineTo(x,yy+50);ctx.lineTo(x+60,yy);ctx.stroke()}ctx.restore()}
function pin(x,y,t,alpha){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;const p=(t*1.2)%1;ctx.beginPath();ctx.arc(x,y,14+p*50,0,7);ctx.strokeStyle=`rgba(255,70,60,${1-p})`;ctx.lineWidth=6;ctx.stroke();
 ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fillStyle='#ff3b30';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore()}
function warn(x,y,s,alpha){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);ctx.shadowColor='rgba(255,40,40,.9)';ctx.shadowBlur=30;
 ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(58,42);ctx.lineTo(-58,42);ctx.closePath();ctx.fillStyle='#e8302a';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(-5,-25,10,42);ctx.beginPath();ctx.arc(0,28,6,0,7);ctx.fill();ctx.restore()}
function mountain(x,y,s,old){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.beginPath();ctx.moveTo(-60,30);ctx.lineTo(0,-45);ctx.lineTo(60,30);ctx.closePath();ctx.fillStyle=mix('#4a5a48','#b89a68',old);ctx.fill();
 ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(60,30);ctx.lineTo(10,30);ctx.closePath();ctx.fillStyle='rgba(0,0,0,.18)';ctx.fill();
 ctx.beginPath();ctx.moveTo(-17,-24);ctx.lineTo(0,-45);ctx.lineTo(17,-24);ctx.lineTo(7,-28);ctx.lineTo(0,-22);ctx.lineTo(-7,-28);ctx.closePath();ctx.fillStyle='#f4f1ea';ctx.fill();ctx.restore()}

// ---------- captions ----------
const CAPS=[];(function(){let cur=[];const strip=w=>w.replace(/[.,:;]+$/,'');
 WORDS.forEach((w,i)=>{cur.push(i);const len=cur.map(j=>strip(WORDS[j][0])).join(' ').length;
  const next=WORDS[i+1];const long=next&&(len+next[0].length>19);
  if(cur.length>=3||/[.,:;]$/.test(w[0])||long||!next){CAPS.push({s:WORDS[cur[0]][1],txt:cur.map(j=>strip(WORDS[j][0])).join(' ')});cur=[]}});
 CAPS.forEach((c,i)=>c.e=i<CAPS.length-1?CAPS[i+1].s:c.s+1.6)})();
function captions(t){const c=CAPS.find(c=>t>=c.s-0.02&&t<c.e);if(!c)return;const k=eo(seg(t,c.s-0.02,c.s+0.1));
 ctx.font='800 70px Inter';let sz=70;const w=ctx.measureText(c.txt).width;if(w>940)sz=70*940/w;
 text(c.txt,W/2,1300,{font:`800 ${sz}px Inter`,alpha:k,scale:0.9+0.1*k,stroke:'rgba(0,0,0,.35)',lw:8})}

// ---------- map scene ----------
function mapScene(t){
 const [lon,lat,span]=cam(t);const sc=W/(span*Math.PI/180);
 const proj=d3.geoMercator().center([lon,lat]).scale(sc).translate([W/2,CY]).clipExtent([[-60,-60],[W+60,H+60]]);
 const path=d3.geoPath(proj,ctx);const pxDeg=W/span;
 const old=Math.min(seg(t,9.2,10.0),1-seg(t,45.5,46.4));
 const C={water:mix('#123247','#8fbcc4',old),land:mix('#34443a','#e7d8b1',old),border:mix('#5d7262','#a88c5c',old),lake:mix('#2f8fd0','#4f9fb6',old),lakeEdge:mix('#7cc6ff','#2f6f80',old)};
 ctx.fillStyle=C.water;ctx.fillRect(0,0,W,H);
 ctx.beginPath();path(COUNTRIES);ctx.fillStyle=C.land;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.border;ctx.stroke();
 ctx.beginPath();path(LAKES);ctx.fillStyle=C.water;ctx.fill();
 // mountains
 const mA=1-seg(span,2,4);if(mA>0){ctx.save();ctx.globalAlpha=mA;MOUNTAINS.forEach(m=>{const q=proj([m[0],m[1]]);mountain(q[0],q[1],m[2]*pxDeg/900,old)});ctx.restore()}

 // historic lakes
 let lakeA=Math.max(seg(t,1.2,2.0)*(1-seg(t,2.6,3.6)),seg(t,9.6,10.6)*(1-seg(t,45.8,46.6)));
 const dry=ease(seg(t,T(103),T(108)+0.8)); // 0..1
 const flood=Math.sin(Math.PI*seg(t,T(90),T(97)+0.6));
 if(lakeA>0){ctx.save();ctx.globalAlpha=lakeA;
  for(const k in SM){let P=SM[k];
   if(dry>0){const tgt=k==='texcoco'?REMNANT:centroid(P);const f=k==='texcoco'?lerp(1,0.07,dry):lerp(1,0,Math.min(1,dry*1.25));P=P.map(p=>[tgt[0]+(p[0]-tgt[0])*f,tgt[1]+(p[1]-tgt[1])*f])}
   if(flood>0&&k==='texcoco'){const c=centroid(P);P=P.map(p=>[c[0]+(p[0]-c[0])*(1+0.05*flood),c[1]+(p[1]-c[1])*(1+0.05*flood)])}
   ringPath(P,proj);const g=ctx.createLinearGradient(0,CY-500,0,CY+500);g.addColorStop(0,C.lake);g.addColorStop(1,mix('#1e6fb0','#3f8da3',old));
   ctx.fillStyle=g;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.lakeEdge;ctx.stroke()}
  // glow pulse "Wasser auf allen Seiten"
  const gl=win(t,T(58)-0.1,T(61)+0.9,.3);if(gl>0){ctx.save();ctx.globalAlpha=gl*(0.5+0.5*Math.sin(t*8));ringPath(SM.texcoco,proj);ctx.shadowColor='#bff';ctx.shadowBlur=40;ctx.lineWidth=10;ctx.strokeStyle='#dffcff';ctx.stroke();ctx.restore()}
  ctx.restore()}

 // canal (Desague)
 const can=seg(t,T(98),T(102)+0.8)*(1-seg(t,45.8,46.5));
 if(can>0){const pts=[[-99.04,19.56],[-99.10,19.70],[-99.17,19.82],[-99.23,19.95],[-99.27,20.10]];const n=Math.floor(can*40);ctx.save();ctx.beginPath();
  for(let i=0;i<=n;i++){const u=i/40*(pts.length-1),j=Math.min(pts.length-2,Math.floor(u)),f=u-j;const q=proj([lerp(pts[j][0],pts[j+1][0],f),lerp(pts[j][1],pts[j+1][1],f)]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
  ctx.lineWidth=8;ctx.strokeStyle='#2c6f8a';ctx.setLineDash([22,12]);ctx.stroke();ctx.restore()}

 // island + causeways
 const isA=seg(t,10.0,10.8)*(1-seg(t,45.6,46.3));
 const cwy=seg(t,T(64),T(66)+0.5);
 if(isA>0){ctx.save();ctx.globalAlpha=isA;
  if(cwy>0){const ends=[[[-99.133,19.452],[-99.125,19.475],[-99.12,19.495]],[[-99.15,19.442],[-99.17,19.445],[-99.192,19.447]],[[-99.135,19.42],[-99.136,19.39],[-99.13,19.365]]];
   ends.forEach(e=>{ctx.beginPath();const n=30;for(let i=0;i<=n*cwy;i++){const u=i/n*2,j=Math.min(1,Math.floor(u)),f=u-j;const q=proj([lerp(e[j][0],e[j+1][0],f),lerp(e[j][1],e[j+1][1],f)]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
    ctx.lineCap='round';ctx.lineWidth=Math.max(6,0.006*pxDeg);ctx.strokeStyle='#8a6a3c';ctx.stroke();ctx.lineWidth=Math.max(2,0.002*pxDeg);ctx.strokeStyle='#e9d6a5';ctx.stroke()})}
  const q=proj(ISLAND);const rx=0.022*pxDeg,ry=0.022*pxDeg*1.06;const isPulse=win(t,T(43),T(46)+1,.3);
  ctx.beginPath();ctx.ellipse(q[0],q[1],rx,ry,0.3,0,7);ctx.fillStyle=mix('#4a5a48','#d8c08a',old);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#6b522e';ctx.stroke();
  if(isPulse>0){ctx.save();ctx.globalAlpha*=isPulse;ctx.beginPath();ctx.ellipse(q[0],q[1],rx+12+10*Math.sin(t*7),ry+12+10*Math.sin(t*7),0.3,0,7);ctx.lineWidth=6;ctx.strokeStyle='#ffef9a';ctx.stroke();ctx.restore()}
  const cityA=seg(t,T(52),T(53)+0.3);
  if(cityA>0&&rx>20){ctx.save();ctx.globalAlpha*=cityA;ctx.beginPath();ctx.ellipse(q[0],q[1],rx-3,ry-3,0.3,0,7);ctx.clip();
   const gs=Math.max(10,rx/7);let s=3;const r=()=>(s=(s*16807)%2147483647)/2147483647;
   for(let x=q[0]-rx;x<q[0]+rx;x+=gs)for(let y=q[1]-ry;y<q[1]+ry;y+=gs){if(r()<.75){ctx.fillStyle=r()<.5?'#b98d5a':'#a77a48';ctx.fillRect(x+1,y+1,gs*0.7,gs*0.7)}}
   ctx.restore();
   // temple
   const ts=rx/110;ctx.save();ctx.globalAlpha*=cityA;ctx.translate(q[0],q[1]);ctx.scale(ts,ts);ctx.fillStyle='#e6dbc4';ctx.strokeStyle='#5a4126';ctx.lineWidth=4;
   [[90,22],[70,22],[50,22],[30,22]].forEach((b,i)=>{ctx.fillRect(-b[0]/2,10-i*22,b[0],22);ctx.strokeRect(-b[0]/2,10-i*22,b[0],22)});
   ctx.fillStyle='#b8402c';ctx.fillRect(-14,-74,12,12);ctx.fillStyle='#2f5f8a';ctx.fillRect(2,-74,12,12);ctx.restore()}
  // flood over island
  if(flood>0){ctx.save();ctx.globalAlpha*=flood*0.85;ctx.beginPath();ctx.ellipse(q[0],q[1],rx*1.15,ry*1.15,0.3,0,7);ctx.fillStyle=C.lake;ctx.fill();ctx.restore();
   ctx.save();ctx.globalAlpha*=flood;ctx.strokeStyle='#e8fbff';ctx.lineWidth=5;for(let i=0;i<3;i++){const yy=q[1]-30+i*30;ctx.beginPath();for(let x=-60;x<=60;x+=6){const y=yy+6*Math.sin(x/12+t*6+i);x===-60?ctx.moveTo(q[0]+x,y):ctx.lineTo(q[0]+x,y)}ctx.stroke()}ctx.restore()}
  ctx.restore()}

 // modern city blob
 const cityA2=Math.max(seg(t,2.7,3.8)*(1-seg(t,9.2,9.8)),seg(t,T(110),T(115)));
 if(cityA2>0){const grow=t<12?1:eo(seg(t,T(110),T(116)));const c=centroid(CITY);const P=CITYS.map(p=>[c[0]+(p[0]-c[0])*grow,c[1]+(p[1]-c[1])*grow]);
  ctx.save();ctx.globalAlpha=cityA2;ringPath(P,proj);ctx.fillStyle='rgba(242,163,58,.32)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='rgba(255,190,90,.8)';ctx.stroke();
  ctx.clip();let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;const cc=proj(c);
  for(let i=0;i<1400;i++){const a=r()*7,d=Math.sqrt(r());const ll=[c[0]+Math.cos(a)*d*0.21,c[1]+Math.sin(a)*d*0.27];const q=proj(ll);const b=r();ctx.fillStyle=`rgba(255,${200+b*55|0},${120+b*80|0},${0.35+0.5*r()})`;ctx.fillRect(q[0],q[1],2+b*3,2+b*3)}
  ctx.restore()}
 // old lake outline (modern)
 const outA=Math.max(win(t,T(119),T(123)+0.4,.4),win(t,T(169),79.8,.5));
 if(outA>0){ctx.save();ctx.globalAlpha=outA;ctx.setLineDash([18,12]);ctx.lineDashOffset=-t*30;ctx.lineWidth=6;ctx.strokeStyle='#7fd3ff';ctx.shadowColor='#3ab0ff';ctx.shadowBlur=18;
  for(const k of ['texcoco','xochimilco','chalco']){ringPath(SM[k],proj);ctx.stroke()}ctx.restore();
  if(t<60){const q=proj([-98.98,19.56]);text('alter Seeboden',q[0],q[1],{font:'italic 700 48px Playfair',fill:'#bfe9ff',alpha:outA})}}

 // spanish route
 const sp=seg(t,T(77)-0.2,T(81)+0.3),spA=1-seg(t,35.0,35.6);
 if(sp>0&&spA>0){const a=proj(VERACRUZ),b=proj([-99.13,19.43]);ctx.save();ctx.globalAlpha=spA;
  const vq=a;ctx.beginPath();ctx.arc(vq[0],vq[1],12,0,7);ctx.fillStyle='#c0392b';ctx.fill();text('Veracruz',vq[0]+10,vq[1]+55,{font:'italic 700 44px Playfair',fill:'#4a2e14',shadow:false,alpha:seg(t,T(77)-0.2,T(77)+0.3)});
  const mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-160;const n=60;ctx.beginPath();for(let i=0;i<=n*eo(sp);i++){const u=i/n;const x=(1-u)*(1-u)*a[0]+2*u*(1-u)*mx+u*u*b[0],y=(1-u)*(1-u)*a[1]+2*u*(1-u)*my+u*u*b[1];i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
